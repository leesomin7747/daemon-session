ing:7px 11px;font-size:12px;white-space:nowrap}.action:hover:enabled{background:#3a4d40}.action.gift-action{border-color:#997965;color:#edc8ad}.action.primary{background:#bbd6b8;border-color:#bbd6b8;color:#243c2b}.noteform{display:flex;gap:8px;margin-top:12px}.noteform input{flex:1;min-width:0;background:#202a23;border:1px solid #526657;border-radius:6px;padding:8px 11px;caret-color:var(--mint);font-size:12px}.noteform input::placeholder{color:#a8baa9}.context{font-size:11px;color:#b5c4b8;margin-top:8px;min-height:18px}.statusline{margin-top:24px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;min-height:59px}.statusline code{color:var(--mint);font-size:11px;flex-shrink:0}.statusline p{font-size:13px}.foot{display:flex;justify-content:space-between;gap:20px;margin-top:14px;font-size:11px;color:#9faf9f}.foot p{max-width:80ch}.motiontoggle{white-space:nowrap;align-self:start}.solo-setting{display:none;align-items:center;gap:6px;font-size:11px;color:#b2c2b4;margin:10px 0 0}.solo-setting.visible{display:flex}.solo-setting input{accent-color:var(--mint)}.paused .walker{animation-play-state:paused}.effect{position:absolute;pointer-events:none;z-index:3}.plane{width:34px;height:30px;left:24%;bottom:65px;color:#ece8d8;animation:fly 1.5s ease-in-out forwards}.rope{height:30px;left:29%;right:29%;bottom:32px;color:#c7b28c}.lure-prop{width:23px;height:25px;left:43%;bottom:21px;color:#dfb77f;animation:snack .8s ease-in-out 2}.blanket{display:none;position:absolute;width:63px;height:40px;left:2px;bottom:10px;background:#a5b2d3;border-radius:17px 17px 8px 8px;clip-path:polygon(0 10%,25% 1%,55% 9%,80% 0,100% 12%,100% 100%,0 100%);border-bottom:5px solid #7e90b6;pointer-events:none}.wrapping .blanket{display:block;animation:cover 1s ease-out}.active-ping .cat{animation:hop .7s ease-out 2}.active-rope{animation:pull 1.8s ease-in-out forwards!important}.active-lure{animation:lure 1.8s ease-in-out forwards!important}.active-coffee .cat{animation:perk 1.4s ease-in-out}.active-energy .cat{animation:zoom .18s ease-in-out 8}.active-plane .cat{animation:bonk 1.5s ease-in-out}.feed-prop{position:absolute;bottom:30px;right:-8px;width:25px;height:27px;color:#e8d6b9;pointer-events:none}.ears-up .cat{transform:translateY(-2px)}.demo-chip{display:none;position:absolute;top:44px;right:13px;color:#a0b3a4;font:10px ui-monospace,monospace}.offline-scrim{position:absolute;top:62px;left:130px;right:15px;color:#a4b7a8;font:11px/1.6 ui-monospace,monospace}.hidden{display:none!important}@keyframes wander{from{transform:translateX(-15px)}to{transform:translateX(15px)}}@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-13px) rotate(-8deg)}70%{transform:rotate(7deg)}}@keyframes pull{0%,20%{transform:translateX(0) rotate(8deg)}65%,80%{transform:translateX(var(--shift)) rotate(-10deg)}100%{transform:translateX(var(--shift))}}@keyframes lure{0%,15%{transform:translateX(0)}65%,80%{transform:translateX(var(--shift))}100%{transform:translateX(var(--shift))}}@keyframes cover{from{transform:translateY(-32px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes fly{0%{left:var(--from);transform:translateY(-36px) rotate(-10deg)}75%{left:var(--to);transform:translateY(-10px) rotate(15deg)}100%{left:var(--to);transform:translateY(25px) rotate(25deg)}}@keyframes bonk{0%,65%,100%{transform:rotate(0)}80%{transform:rotate(13deg) translateY(4px)}}@keyframes perk{0%{transform:translateY(3px)}60%{transform:translateY(-8px) scaleY(1.07)}100%{transform:none}}@keyframes zoom{from{transform:translateX(-3px) rotate(-3deg)}to{transform:translateX(3px) rotate(3deg)}}@keyframes snack{50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:900px){main{padding:26px 22px}.screens{gap:16px}.workspace{grid-template-columns:83px 1fr}.files{padding:18px 9px}.code{padding:18px 10px;font-size:10px}.pets{--a:13%;--b:62%}.control{grid-template-columns:135px 1fr}.desktop{container-type:inline-size;height:355px}}@media(max-width:640px){main{padding:22px 18px}header{display:block}h1{font-size:23px}.connection{margin-top:15px}.screens{grid-template-columns:1fr;gap:18px}.desktop{container-type:inline-size;height:310px}.control{grid-template-columns:1fr;gap:12px}.actor{flex-direction:row;align-items:center}.actor p{margin:0 6px 0 0}.actor button{flex:1}.foot{flex-direction:column;gap:10px}.statusline{gap:9px}.statusline p{font-size:12px}.floating{bottom:127px}.noteform .action{padding:7px 10px}}

<main>
<header><div><h1>같은 세션의 밤.</h1><p class="muted">말이 없어도, 작업창 아래에서 같이.</p></div><div><div class="connection" id="connection"><span class="light"></span><span class="mono" id="connection-label">session connected</span><button class="textbutton" id="online-toggle">친구 offline로 전환</button></div><label class="solo-setting" id="solo-setting"><input type="checkbox" id="solo" checked>혼자일 때도 내 펫 켜두기</label></div></header>
<div class="screens" id="screens"></div>
<div class="control"><div class="actor"><p>목업에서 보내는 쪽</p><button id="actor-a" aria-pressed="true">나 → 친구</button><button id="actor-b" aria-pressed="false">친구 → 나</button></div><div><div class="actions" id="actions"><button class="action primary" data-act="ping">ping 보내기</button><button class="action" data-act="rope">밧줄 끌기</button><button class="action" data-act="lure">간식으로 꼬시기</button><button class="action" data-act="blanket">담요 덮기</button><button class="action" data-act="plane">종이비행기</button><button class="action gift-action" data-act="coffee">커피 건네기</button><button class="action gift-action" data-act="energy">에너지음료</button></div><form class="noteform" id="noteform"><input id="note-input" aria-label="친구에게 보낼 짧은 쪽지" placeholder="말이 떠오르면, 짧은 쪽지 한 장." maxlength="120" autocomplete="off"><button class="action" id="note-send" type="submit">쪽지 보내기</button></form><p class="context" id="context"></p></div></div>
<div class="statusline"><code id="event-label">session</code><p id="event-copy" role="status" aria-live="polite">각자 할 일은 다르고, 켜둔 밤은 같네요.</p></div>
<div class="foot"><p>인터랙션 목업 · 펫을 눌러 WIP를 보고, 각 화면의 busy를 켜보세요. 두 화면을 한 탭에서 재현하며 실제 OS 오버레이·온라인 연결·저장은 아직 없어요.</p><button class="textbutton motiontoggle" id="motion-toggle" aria-pressed="false">움직임 멈추기</button></div>
</main>
<script>
const people={a:{wip:'알고리즘 과제',busy:false,inbox:[],gifts:[],position:null},b:{wip:'OO프로젝트 UX 점검',busy:false,inbox:[],gifts:[],position:null}};
const state={actor:'a',online:true,solo:true,open:null,effect:null,paused:false};
const words={
 join:['같은 세션에 접속했어요. 각자 하던 것부터 이어가요.','두 자리 모두 online. 오늘도 한 화면 아래에서 만났네요.','친구가 들어왔어요. 조용하던 구석이 조금 덜 조용해졌네요.'],
 leave:['친구가 세션을 나갔어요. 남은 작업은 천천히 해요.','친구는 잠시 offline. 오늘도 같이 버텼네요.','오늘의 동시 접속은 여기까지. 꽤 괜찮은 밤이었어요.'],
 leaveCoffee:['친구는 나갔지만, 커피는 두고 갔어요.','친구는 offline. 커피는 아직 여기 있어요.'],
 ping:['툭. 딱히 할 말은 없고, 그냥 여기 있다고요.','응답 속도보다, 옆에 있다는 게 중요하죠.','작업창 아래에서 작은 ping이 왔어요.'],
 rope:['밧줄을 던졌어요. 친구와의 거리가 물리적으로 줄었네요.','조금만 이쪽으로. 의자는 가져오지 않아도 돼요.','친구를 끌어왔어요. 하던 일은 잠깐 쭈그러졌고요.'],
 lure:['간식을 꺼냈어요. 집중력의 방향이 바뀌었네요.','발은 이미 움직이고 있어요. 눈은 간식에 붙어 있고요.','작업은 잠깐 대기. 간식은 실시간이에요.'],
 blanket:['담요를 덮었어요. 귀 두 개는 덮이지 않았네요.','잠깐 따뜻해졌어요. 작업창은 아직 열려 있고요.','담요 속에서도 친구의 접속은 유지돼요.'],
 plane:['종이비행기가 도착했어요. 착륙장은 친구 머리였어요.','전송 완료. 목적지보다 조금 위에 도착했네요.','비행기는 무사해요. 친구의 집중은 잠깐 흔들렸고요.'],
 coffee:['커피 한 잔 도착. 말 대신 두 손으로 건넸어요.','눈이 조금 커졌어요. 커피가 일을 시작했나 봐요.','한 모금 마셨어요. 이제 다시 커서와 눈싸움이에요.'],
 energy:['에너지음료를 마셨어요. 발이 조금 바빠졌네요.','작은 캔 하나에 움직임이 좀 많이 들어 있었어요.','잠깐 속도가 올랐어요. 할 일은 도망가지 않았고요.'],
 busy:['지금은 busy. 작은 책상에 큰 집중이 올라왔어요.','안경을 썼어요. 잠깐 작업 속으로 들어가요.','친구가 작업에 푹 빠졌어요. 옆자리는 그대로예요.'],
 ready:['busy를 풀었어요. 다시 툭 건드려도 돼요.','책상에서 잠깐 나왔어요. 작은 장난을 받을 여유가 생겼네요.'],
 queuedGift:['지금은 busy. 선물은 옆에 살짝 두었어요.','작업을 깨우지 않고, 작은 선물만 놓고 갔어요.','친구는 집중 중. 선물은 옆에서 기다리는 중이에요.'],
 queuedNote:['쪽지 한 장을 옆에 두었어요. 지금은 busy니까요.','할 말은 종이에 맡겼어요. 친구는 하던 일을 이어가요.'],
 note:['쪽지 한 장 도착. 길게 말하지 않아도 괜찮아요.','작업창 아래에 말 한 조각이 도착했어요.','짧은 쪽지가 도착했어요. 커서는 잠깐 쉬어도 되겠네요.']};
let lastLine='',effectTimer;
const petLines={
 coffee:['한 모금만','이 잔은 내 거','눈이 좀 떠지네','따뜻할 때 마실게','커피 옆에 살래'],
 energy:['아직 할 수 있어','발이 먼저 깼어','잠깐, 너무 빨라','한 캔만 더 버틴다','지금은 잠이 offline']
};
const lastPetLine={};
function pickPetLine(kind){
 const pool=petLines[kind];
 if(!pool)return {ping:'나 여기 있어',rope:'어어, 잠깐만',lure:'간식?',blanket:'따뜻하네',plane:'머리에 착륙'}[kind];
 const available=pool.filter(line=>line!==lastPetLine[kind]);
 return lastPetLine[kind]=available[Math.floor(Math.random()*available.length)];
}
function petPosition(id){
 const el=document.querySelector('.walker.person-'+id),host=el.closest('.pets');
 return {x:(el.getBoundingClientRect().left-host.getBoundingClientRect().left)/host.clientWidth,
 width:el.offsetWidth/host.clientWidth,margin:12/host.clientWidth,hostWidth:host.clientWidth};
}
function movementFor(target,kind){
 const source=petPosition(state.actor),recipient=petPosition(target);
 const gap=(kind==='rope'?26:40)/source.hostWidth;
 const spacing=recipient.width+gap;
 const min=recipient.margin,max=1-recipient.width-recipient.margin;
 const direction=recipient.x>=source.x?1:-1;
 let destination=source.x+direction*spacing;
 if(destination<min||destination>max)destination=source.x-direction*spacing;
 destination=Math.max(min,Math.min(max,destination));
 const immediate=state.paused||window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 people[target].position=destination;
 return {from:immediate?destination:recipient.x,to:destination,source:source.x};
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=(name,cls='')=>`<svg class="${cls}" aria-hidden="true"><use href="#${name}-v2"/></svg>`;
function say(key,label){const pool=words[key].filter(s=>s!==lastLine);lastLine=pool[Math.floor(Math.random()*pool.length)]||words[key][0];document.getElementById('event-label').textContent=label;document.getElementById('event-copy').textContent=lastLine}
function petHTML(id,view){const person=people[id],local=id===view,active=state.effect?.target===id?state.effect.kind:'',open=state.open?.view===view&&state.open?.person===id;
 const moving=state.effect?.target===id&&['rope','lure'].includes(active);
 const position=moving?state.effect.from:person.position;
 const posStyle=position===null?'':'--pos:'+position*100+'%;';
 const shift=moving?(state.effect.to-state.effect.from)*100+'cqw':'0px';
 const gifts=person.gifts.slice(-2).map(type=>svg(type==='energy'?'energy':'cup')).join('')+(person.inbox.some(item=>item.type==='note')?svg('note'):'');
 return `<div class="walker person-${id} ${person.position!==null?'has-position':''} ${person.busy?'is-busy':''} ${active?'active-'+active:''} ${active==='blanket'?'wrapping':''}" style="${posStyle}--shift:${shift}"><button class="avatar" data-pet="${id}" data-view="${view}" aria-label="${local?'내':'친구'} 펫 WIP 보기" aria-expanded="${!!open}"><svg class="cat" viewBox="0 0 80 80" aria-hidden="true"><use href="#cat-v2"/><g class="glasses" fill="none" stroke="#283c31" stroke-width="2.5"><rect x="23" y="38" width="14" height="12" rx="3"/><rect x="43" y="38" width="14" height="12" rx="3"/><path d="M37 42H43M18 40H23M57 40H62"/></g></svg><span class="blanket"></span>${active==='coffee'||active==='energy'?svg(active==='energy'?'energy':'cup','feed-prop'):''}</button>${person.busy?'<svg class="tiny-desk" viewBox="0 0 72 30" aria-hidden="true"><path d="M3 8H69M10 8V29M62 8V29" stroke="#c5b28d" stroke-width="4"/><path d="M26 8V0H48V8" fill="#334439" stroke="#9cae98" stroke-width="1.5"/></svg>':''}<span class="name">${local?'나':'친구'}${person.busy?'<span class="busy-word">busy</span>':''}</span>${active&&!person.busy?'<span class="bubble">'+esc(state.effect.bubble)+'</span>':''}${(person.gifts.length||person.inbox.some(item=>item.type==='note'))?'<span class="pile">'+gifts+'</span>':''}${person.inbox.length?`<button class="queue" data-inbox="${id}" data-view="${view}" aria-label="${local?'내':'친구'} 쌓인 선물과 쪽지 ${person.inbox.length}개 보기">${person.inbox.length}개 쌓였어요</button>`:''}</div>`}
function popupHTML(view){if(!state.open||state.open.view!==view)return '';const id=state.open.person,p=people[id],local=id===view;const head=`<div class="floathead"><strong class="mono">${state.open.type==='inbox'?'받은 선물 · 쪽지':'WIP'}</strong><button class="close" aria-label="패널 닫기" data-close>×</button></div>`;
 if(state.open.type==='inbox')return `<div class="floating ${id==='a'?'left':'right'}">${head}<div class="inbox">${p.inbox.length?p.inbox.map(item=>`<div class="inbox-item"><small>${item.type==='note'?'쪽지':item.type==='coffee'?'커피':'에너지음료'}</small>${esc(item.text)}</div>`).join(''):'<p class="muted">아직 받은 것이 없어요.</p>'}</div>${local&&p.inbox.length?`<button class="save" data-read="${id}">확인했어요</button>`:''}</div>`;
 return `<div class="floating ${id==='a'?'left':'right'}">${head}${local?`<form class="wipform" data-owner="${id}"><label for="wip-${view}">지금 하는 일</label><textarea id="wip-${view}" name="wip" maxlength="80">${esc(p.wip)}</textarea><button class="save" type="submit">남겨두기</button></form>`:p.wip?`<p class="wiptext">${esc(p.wip)}</p>`:'<p class="empty">null</p>'}</div>`}
function renderScreens(){document.getElementById('screens').innerHTML=['a','b'].map((view,i)=>{const title=i===0?'내 화면':'친구 화면',shown=state.online?['a','b']:state.solo?[view]:[];let effects='';if(state.effect&&state.online){const target=state.effect.target;if(state.effect.kind==='plane')effects=svg('plane','effect plane');if(state.effect.kind==='rope')effects='<svg class="effect rope" viewBox="0 0 200 30" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20Q80 0 200 20" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="4 2"/></svg>';if(state.effect.kind==='lure')effects='<svg class="effect lure-prop" style="left:calc('+state.effect.to*100+'% + 24px)" aria-hidden="true"><use href="#snack-v2"/></svg>'}
 return `<section aria-label="${title}"><div class="scenehead"><h2>${title}<span class="muted"> · ${i===0?'알고리즘 과제':'UX 점검'}</span></h2><label class="busy-toggle"><input type="checkbox" data-busy="${view}" aria-label="${title} busy" ${people[view].busy?'checked':''}><span class="mono">busy</span></label></div><div class="desktop"><div class="bar"><i></i><i></i><i></i><span class="mono">${i===0?'workspace / solve.ts':'workspace / review.md'}</span></div><div class="workspace"><div class="files">EXPLORER<br><br>src<br>&nbsp; solve.ts<br>&nbsp; review.md<br><br>notes</div><div class="code">${i===0?'<span class="ln">1</span><b>async function</b> solve() {\n<span class="ln">2</span>  <b>const</b> task = <em>"하나씩"</em>;\n<span class="ln">3</span>\n<span class="ln">4</span>  <b>await</b> tryAgain(task);\n<span class="ln">5</span>\n<span class="ln">6</span>  <b>return</b> <em>"오늘은 여기까지"</em>;\n<span class="ln">7</span>}':'<span class="ln">1</span><b># UX 점검</b>\n<span class="ln">2</span>\n<span class="ln">3</span>처음 들어왔을 때\n<span class="ln">4</span>무엇을 해야 할지 보이는가?\n<span class="ln">5</span>\n<span class="ln">6</span><em>조금 더 편한 흐름 찾기.</em>'}</div></div><span class="demo-chip">${state.online?'session connected':'solo session'}</span><div class="pets" style="${people.a.position!==null?'--a:'+people.a.position*100+'%;':''}${people.b.position!==null?'--b:'+people.b.position*100+'%;':''}--from:${state.effect?.target==='a'?'var(--b)':'var(--a)'};--to:${state.effect?.target==='a'?'var(--a)':'var(--b)'}">${shown.map(id=>petHTML(id,view)).join('')}${effects}</div>${popupHTML(view)}<div class="deskfooter"><span>밤샘 작업 중</span><span>${people[view].busy?'busy':'online'}</span></div></div></section>`}).join('');bindScreenEvents()}
function bindScreenEvents(){document.querySelectorAll('[data-busy]').forEach(el=>el.onchange=()=>{const id=el.dataset.busy;people[id].busy=el.checked;clearEffect();state.open=null;render();say(el.checked?'busy':'ready',el.checked?'busy':'online')});document.querySelectorAll('[data-pet]').forEach(el=>el.onclick=()=>{const next={type:'wip',person:el.dataset.pet,view:el.dataset.view};state.open=state.open?.person===next.person&&state.open?.view===next.view&&state.open?.type==='wip'?null:next;renderScreens()});document.querySelectorAll('[data-inbox]').forEach(el=>el.onclick=()=>{state.open={type:'inbox',person:el.dataset.inbox,view:el.dataset.view};renderScreens()});document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>{state.open=null;renderScreens()});document.querySelectorAll('.wipform').forEach(form=>form.onsubmit=e=>{e.preventDefault();people[form.dataset.owner].wip=form.elements.wip.value.trim();state.open=null;renderScreens();document.getElementById('event-label').textContent='WIP';document.getElementById('event-copy').textContent='지금 하는 일을 남겼어요. 친구가 펫을 누르면 읽을 수 있어요.'});document.querySelectorAll('[data-read]').forEach(el=>el.onclick=()=>{people[el.dataset.read].inbox=[];renderScreens()})}
function renderControls(){const target=state.actor==='a'?'b':'a',busy=people[target].busy;document.getElementById('actor-a').setAttribute('aria-pressed',String(state.actor==='a'));document.getElementById('actor-b').setAttribute('aria-pressed',String(state.actor==='b'));document.querySelectorAll('[data-act]').forEach(btn=>{const gift=['coffee','energy'].includes(btn.dataset.act);btn.disabled=!state.online||(!gift&&busy);btn.title=!state.online?'친구가 offline이에요':busy&&!gift?'busy 중에는 장난이 통하지 않아요':''});document.getElementById('note-send').disabled=!state.online;document.getElementById('note-input').disabled=!state.online;document.getElementById('context').textContent=!state.online?'친구가 offline이에요. 장난과 선물, 쪽지는 함께 접속했을 때 보낼 수 있어요.':busy?'받는 쪽이 busy예요. 장난은 잠시 멈추고, 선물과 쪽지는 옆에 쌓아둬요.':'펫을 누르면 WIP가 열려요. 내 WIP는 직접 바꾸고, 친구의 WIP는 읽을 수 있어요.';document.getElementById('connection').classList.toggle('off',!state.online);document.getElementById('connection-label').textContent=state.online?'session connected':'peer offline';document.getElementById('online-toggle').textContent=state.online?'친구 offline로 전환':'친구 다시 접속';document.getElementById('solo-setting').classList.toggle('visible',!state.online)}
function render(){renderScreens();renderControls();document.body.classList.toggle('paused',state.paused)}
function clearEffect(){clearTimeout(effectTimer);state.effect=null}
function act(kind){const target=state.actor==='a'?'b':'a',gift=['coffee','energy'].includes(kind),p=people[target];if(!state.online||p.busy&&!gift)return;clearEffect();state.open=null;if(gift){p.gifts.push(kind);if(p.busy){p.inbox.push({type:kind,text:kind==='coffee'?'친구가 커피 한 잔을 두고 갔어요.':'친구가 에너지음료를 두고 갔어요.'});render();say('queuedGift','queued');return}}
 const movement=['rope','lure'].includes(kind)?movementFor(target,kind):{};
 state.effect={kind,target,bubble:pickPetLine(kind),...movement};render();say(kind,kind==='ping'?'ping':gift?'gift':'play');effectTimer=setTimeout(()=>{state.effect=null;renderScreens()},2400)}
document.querySelectorAll('[data-act]').forEach(btn=>btn.onclick=()=>act(btn.dataset.act));
document.getElementById('actor-a').onclick=()=>{state.actor='a';renderControls()};document.getElementById('actor-b').onclick=()=>{state.actor='b';renderControls()};
document.getElementById('noteform').onsubmit=e=>{e.preventDefault();if(!state.online)return;const input=document.getElementById('note-input'),text=input.value.trim();if(!text){input.focus();return}const target=state.actor==='a'?'b':'a';people[target].inbox.push({type:'note',text});input.value='';renderScreens();say(people[target].busy?'queuedNote':'note',people[target].busy?'queued':'note')};
document.getElementById('online-toggle').onclick=()=>{clearEffect();state.online=!state.online;state.open=null;render();say(state.online?'join':Object.values(people).some(p=>p.gifts.includes('coffee'))?'leaveCoffee':'leave',state.online?'session':'offline')};
document.getElementById('solo').onchange=e=>{state.solo=e.target.checked;renderScreens()};
document.getElementById('motion-toggle').onclick=function(){state.paused=!state.paused;document.body.classList.toggle('paused',state.paused);this.setAttribute('aria-pressed',String(state.paused));this.textContent=state.paused?'움직임 다시 켜기':'움직임 멈추기'};
render();
</script>
